name: aspect_driven_grid
description: A Flutter grid whose column count and spacing are derived from the container's aspect ratio, with zero hardcoded pixel values.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
